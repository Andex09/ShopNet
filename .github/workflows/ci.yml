name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # NuGetAudit + warnings as errors: a package with a known vulnerability fails the restore.
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore ShopNet.slnx

      - name: Build
        run: dotnet build ShopNet.slnx --configuration "$CONFIGURATION" --no-restore

      # Integration tests start SQL Server 2025 with Testcontainers on the runner's Docker.
      - name: Test
        run: >
          dotnet test --solution ShopNet.slnx --configuration "$CONFIGURATION" --no-build
          --coverage --coverage-settings "$GITHUB_WORKSPACE/tests/coverage.settings.xml"
          --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:TestResults/coverage \
            -reporttypes:"MarkdownSummaryGithub;Cobertura;Html"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: TestResults/coverage
          if-no-files-found: ignore
